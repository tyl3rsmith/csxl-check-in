<div>
  <h2>
    <button class="button-56" role="button" routerLink="/">Home</button>
  </h2>
</div>
<body>
<div class="center-container">
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form">
    <div class="message">
      <p>{{ message }}</p>
    </div>
    <div class="title">Welcome</div>
    <div class="subtitle">Let's register!</div>
  
    <div class="input-container ic2">
      <input id="pid" class="input" type="text" formControlName="pid" />
      <div class="cut cut-short"></div>
      <label for="pid" class="placeholder">PID</label>
    </div>
    <div class="input-container ic2">
      <input id="first_name" class="input" type="text" formControlName="first_name" />
      <div class="cut"></div>
      <label for="first_name" class="placeholder">First Name</label>
    </div>
    <div class="input-container ic2">
      <input id="last_name" class="input" type="text" formControlName="last_name" />
      <div class="cut"></div>
      <label for="last_name" class="placeholder">Last Name</label>
    </div>
    <div class="submit-button">
    <button type="submit" class="submit">Submit</button>
    </div>
  </div>
</form>
</div>
</body>
